[package]
name = "tom-assist-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tom-assist-persistence = { path = "../../../crates/persistence" }
tom-assist-oauth = { path = "../../../crates/oauth-broker" }
tom-assist-protocol = { path = "../../../crates/protocol" }
tom-assist-tom-adapter = { path = "../../../crates/tom-adapter" }
tom-assistd = { path = "../../../crates/assistd" }
