[package]
name = "tom-assist-persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
encrypted-store = []

[dependencies]
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tom-assist-protocol = { path = "../protocol" }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
