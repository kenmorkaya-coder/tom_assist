[package]
name = "tom-assist-native-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tom-assist-native-host"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tom-assist-protocol = { path = "../protocol" }

[dev-dependencies]
tempfile = "3"
