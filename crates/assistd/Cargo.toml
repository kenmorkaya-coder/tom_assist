[package]
name = "tom-assistd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tom-assistd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tom-assist-persistence = { path = "../persistence" }
tom-assist-protocol = { path = "../protocol" }
tom-assist-governance = { path = "../governance" }
tom-assist-tom-adapter = { path = "../tom-adapter" }
tom-assist-context-admission = { path = "../context-admission" }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
